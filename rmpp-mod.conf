# rmpp-mod.conf: how the rmpp installer lists and installs this mod.
# Format: https://github.com/lorancecall/rmpp-packages/blob/main/MODS.md
id=rmpp-hwr
type=release
default=0
needs=rmpp-preload
assets=librmpp-hwr-ui.so librmpp_hwr.so libonnxruntime.so rec.onnx dict.txt rmpp-install.sh
check=test -e /usr/lib/rmpp-preload.d/60-rmpp-hwr.so
short_ko=손글씨 인식 (실험적)
short_en=Handwriting recognition (beta)
detail_ko=툴바의 Convert page로 손글씨(한국어·영어·숫자)를|텍스트로 바꿉니다. 설정 > Handwriting.|GitHub 릴리스에서 설치합니다 (/home에 약 40 MB).
detail_en=Convert page in the toolbar turns handwriting (Korean,|English, digits) into text. Settings > Handwriting.|Installed from its GitHub release (about 40 MB in /home).
