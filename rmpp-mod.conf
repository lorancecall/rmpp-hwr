# rmpp-mod.conf: how the rmpp installer lists and installs this mod.
# Format: https://github.com/lorancecall/rmpp-packages/blob/main/MODS.md
id=rmpp-hwr
type=release
default=0
needs=rmpp-preload
assets=librmpp-hwr-ui.so librmpp_hwr.so libonnxruntime.so rec.onnx dict.txt model.txt pack.json texts.tar pack-rmpp-hwr-chinese-base.tar pack-rmpp-hwr-japanese-base.tar pack-rmpp-hwr-english-base.tar pack-rmpp-hwr-latin-base.tar rmpp-install.sh
check=test -e /usr/lib/rmpp/preload.d/60-rmpp-hwr.so -o -e /usr/lib/rmpp-preload.d/60-rmpp-hwr.so
short_ko=손글씨 인식 (실험적)
short_en=Handwriting recognition (beta)
detail_ko=라쏘로 고른 손글씨를 옮길 수 있는 잉크 글씨로(더블탭 편집),|Convert page로 페이지를 텍스트로 바꿉니다 (한국어 모델 + 중국어·일본어·영어·라틴 기본 팩).|설정 > Handwriting. GitHub 릴리스에서 설치 (/home에 약 80 MB).
detail_en=Lasso handwriting -> movable ink text (double tap to edit);|Convert page turns a page into text (Korean model + Chinese, Japanese, English, Latin base packs).|Settings > Handwriting. From its GitHub release (~80 MB).
